# ROVA reverse proxy — TLS termination and WebSocket upgrade.
#
# Obtain a certificate first:
#   sudo certbot certonly --nginx -d rova.example.com
#
# ROVA sends a private bearer token on every /v1 request, so HTTPS is not
# optional here: without it the token travels in clear text.

server {
    listen 80;
    server_name rova.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rova.example.com;

    ssl_certificate     /etc/letsencrypt/live/rova.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rova.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;

    # /health is public; every other route checks the device token in the
    # application layer.
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3111/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
