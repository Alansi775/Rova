name: ROVA
options:
  bundleIdPrefix: com.alansi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Mohammed Saleh (Personal Team) — deliberately NOT the employer's
    # MSG ONE team, under which every App ID is visible to that team's
    # admins. ROVA is a personal project and does not belong there.
    #
    # The cost of a free personal team is that provisioning profiles last
    # seven days: the app stops launching after that and has to be rebuilt
    # and reinstalled from this Mac. A paid personal membership removes
    # that, and nothing here would change but this one line.
    DEVELOPMENT_TEAM: 4384CMSNNM
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ROVA:
    type: application
    platform: iOS
    sources:
      - path: ROVA
        excludes: ["Resources/rova-transit.sqlite"]
      - path: ROVA/Resources/rova-transit.sqlite
        type: file
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - target: ROVAWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alansi.rova
        PRODUCT_NAME: ROVA
        INFOPLIST_FILE: ROVA/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  ROVAWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ROVAWidget
      # ActivityKit matches the attributes type by name across the two
      # bundles, so both must compile the identical declaration. A widget
      # built against a different shape shows nothing, silently.
      - path: ROVA/Live/TripActivityAttributes.swift
    info:
      path: ROVAWidget/Info.plist
      properties:
        CFBundleDisplayName: ROVA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alansi.rova.widget
        PRODUCT_NAME: ROVAWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  ROVATests:
    type: bundle.unit-test
    platform: iOS
    sources: [ROVATests]
    dependencies:
      - target: ROVA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alansi.rova.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ROVA:
    build:
      targets: { ROVA: all, ROVATests: [test] }
    test:
      targets: [ROVATests]
      environmentVariables:
        - variable: ROVA_LIVE_TESTS
          value: "1"
          isEnabled: false
    run: {}
