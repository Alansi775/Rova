name: ROVA
options:
  bundleIdPrefix: com.msgone
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The employer's team — and, checked rather than assumed, this does not
    # put ROVA in front of them.
    #
    # The project was moved to the owner's personal team over exactly that
    # worry, then moved back, because a free personal team's profiles last
    # seven days and the app would stop launching mid-week. The company
    # wildcard profile runs to September 2027.
    #
    # The worry turned out to be unfounded, and the earlier note here was
    # wrong. Signing uses the team's wildcard profile, so Xcode never created
    # an App ID for this bundle. The Identifiers list on developer.apple.com
    # holds the two company apps and two XC placeholders — nothing named ROVA
    # exists there at all.
    #
    # That holds only while the app needs no capability requiring an explicit
    # App ID. Adding push notifications or App Groups would make Xcode
    # register this bundle, and it would then be visible to every Admin on the
    # team. Live Activities as built here update locally and need neither.
    #
    # To move to the personal team anyway, change this line to the personal
    # team and bundleIdPrefix above to a personal namespace.
    DEVELOPMENT_TEAM: 7UM534HHV5
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ROVA:
    type: application
    platform: iOS
    sources:
      - path: ROVA
        excludes: ["Resources/rova-transit.sqlite"]
      - path: ROVA/Resources/rova-transit.sqlite
        type: file
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - target: ROVAWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msgone.rova
        PRODUCT_NAME: ROVA
        INFOPLIST_FILE: ROVA/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  ROVAWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ROVAWidget
      # ActivityKit matches the attributes type by name across the two
      # bundles, so both must compile the identical declaration. A widget
      # built against a different shape shows nothing, silently.
      - path: ROVA/Live/TripActivityAttributes.swift
    info:
      path: ROVAWidget/Info.plist
      properties:
        CFBundleDisplayName: ROVA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msgone.rova.widget
        PRODUCT_NAME: ROVAWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  ROVATests:
    type: bundle.unit-test
    platform: iOS
    sources: [ROVATests]
    dependencies:
      - target: ROVA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msgone.rova.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ROVA:
    build:
      targets: { ROVA: all, ROVATests: [test] }
    test:
      targets: [ROVATests]
      environmentVariables:
        - variable: ROVA_LIVE_TESTS
          value: "1"
          isEnabled: false
    run: {}
